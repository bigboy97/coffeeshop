---
title: contact
slogan: Better Beans, better coffee
---

<div class="container">
  <main class="main-content page-{{title}}">
    <h2 class="heading-title">reserve your<span>table here</span></h2>

    <div class="entireForm">
      <form method= "get" id="form" class="grid-x">
        <div class="input small-8 cell">
          <label for="name"><span>Your Name </span><input type="text" id="name" placeholder="Full Name" name="name" required></label>
        </div>
        <div class="input small-8 cell">
          <label for="phone"><span>Email </span><input type="text" id="email" placeholder="Email" name="email" required></label>
        </div>
        <div class="input small-8 cell">
          <label for="for"><span>For </span><input type="text" id="for" placeholder="10 People" name="for" required></label>
        </div>
        <div class="input small-8 cell">
            <label for="time"><span>At </span><input type="text" id="time" placeholder="10:30" name="time"></label>
        </div>
        <div class="input small-8 cell">
            <label for="when"><span>When </span><input type="text" id="when" name="when" placeholder="10/10/2017" required></label>
        </div>
        <div class="input small-8 cell">
          <input type="submit" value="Submit" class="button send_btn">
        </div>
      </form>
      <img src="../assets/img/coffee_beans.jpg">
    </div>

    
  </main>
</div>
